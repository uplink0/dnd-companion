services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dnd_realm
      POSTGRES_USER: dnd
      POSTGRES_PASSWORD: dnd
    volumes:
      - dnd_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd -d dnd_realm"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      PORT: 3000
      DATABASE_URL: postgres://dnd:dnd@db:5432/dnd_realm
      AUTO_MIGRATE: "true"
      SEED_DEMO: "true"
      DND_MCP_ENABLED: ${DND_MCP_ENABLED:-false}
      DND_MCP_TOKEN: ${DND_MCP_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  dnd_data:
