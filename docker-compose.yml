services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dnd_realm
      POSTGRES_USER: dnd
      POSTGRES_PASSWORD: dnd
    volumes:
      - dnd_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd -d dnd_realm"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      PORT: 3000
      DATABASE_URL: postgres://dnd:dnd@db:5432/dnd_realm
      AUTO_MIGRATE: "true"
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  dnd_data:
