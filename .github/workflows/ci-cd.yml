name: DND Realm CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Проверка синтаксиса серверного кода
        run: |
          node --check server/index.js
          node --check server/api.js
          node --check server/ai-api.js
          node --check server/ai-master.js
          node --check server/character-api.js
          node --check server/character-rules.js
          node --check server/game-engine.js
          node --check server/player-api.js
          node --check server/rules.js
          node --check server/config.js
          node --check server/db.js
          node --check server/migrate.js

      - name: Проверка синтаксиса клиентских скриптов
        run: |
          find public -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to AtlasInfra
        uses: appleboy/ssh-action@v1.2.2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: openrouter/free
        with:
          host: 194.147.215.29
          username: ivan
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: OPENAI_API_KEY,OPENROUTER_API_KEY,OPENAI_BASE_URL,OPENAI_MODEL
          script: |
            set -e
            cd /home/ivan/dnd-companion

            git fetch origin main
            git reset --hard origin/main

            AI_API_KEY="${OPENROUTER_API_KEY:-$OPENAI_API_KEY}"
            AI_API_KEY="$(printf '%s' "$AI_API_KEY" | tr -d '\r\n' | xargs)"

            touch .env
            if [ -n "$AI_API_KEY" ]; then
              grep -v '^OPENAI_API_KEY=' .env > .env.tmp || true
              mv .env.tmp .env
              printf '\nOPENAI_API_KEY=%s\n' "$AI_API_KEY" >> .env
            fi
            grep -v '^OPENAI_BASE_URL=' .env > .env.tmp || true
            mv .env.tmp .env
            printf 'OPENAI_BASE_URL=%s\n' "$OPENAI_BASE_URL" >> .env
            grep -v '^OPENAI_MODEL=' .env > .env.tmp || true
            mv .env.tmp .env
            printf 'OPENAI_MODEL=%s\n' "$OPENAI_MODEL" >> .env

            docker compose up -d --build
            docker compose ps

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/api/health; then
                echo "Application is healthy"
                exit 0
              fi
              echo "Waiting for application... attempt $i/30"
              sleep 2
            done

            echo "Application healthcheck failed"
            docker compose logs --tail=120
            exit 1
