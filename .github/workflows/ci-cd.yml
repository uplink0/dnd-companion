name: DND Realm CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Проверка синтаксиса серверного кода
        run: |
          node --check server/index.js
          node --check server/api.js
          node --check server/ai-api.js
          node --check server/ai-master.js
          node --check server/codex-app-server.js
          node --check server/mcp.js
          node --check server/mcp-oauth.js
          node --check server/character-api.js
          node --check server/character-rules.js
          node --check server/game-engine.js
          node --check server/item-return.js
          node --check server/player-api.js
          node --check server/rules.js
          node --check server/config.js
          node --check server/db.js
          node --check server/migrate.js

      - name: Проверка синтаксиса клиентских скриптов
        run: |
          find public -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Deploy to AtlasInfra
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.2
        env:
          DND_MCP_TOKEN: ${{ secrets.DND_MCP_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ vars.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        with:
          host: 194.147.215.29
          username: ivan
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DND_MCP_TOKEN,OPENAI_API_KEY,OPENAI_BASE_URL,OPENAI_MODEL,OPENROUTER_API_KEY,OPENROUTER_BASE_URL,OPENROUTER_MODEL
          script: |
            set -e
            cd /home/ivan/dnd-companion

            git fetch origin main
            git reset --hard origin/main

            touch .env

            write_env() {
              local key="$1"
              local value="$2"
              grep -v "^${key}=" .env > .env.tmp || true
              mv .env.tmp .env
              if [ -n "$value" ]; then
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }

            # Local Ollama on Lenovo K14 is the canonical AI provider.
            # Codex is no longer part of the gameplay response path.
            write_env AI_PROVIDER "ollama"
            write_env OLLAMA_BASE_URL "http://10.77.0.2:11434/v1"
            write_env OLLAMA_MODEL "qwen2.5:3b"
            write_env OLLAMA_API_KEY "ollama"
            write_env DND_MCP_ENABLED "true"
            write_env DND_MCP_TOKEN "${DND_MCP_TOKEN:-}"
            write_env DND_MCP_OAUTH_ENABLED "true"
            write_env OPENAI_API_KEY "${OPENAI_API_KEY:-}"
            write_env OPENAI_BASE_URL "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
            write_env OPENAI_MODEL "${OPENAI_MODEL:-gpt-5.6-luna}"
            write_env OPENROUTER_API_KEY "${OPENROUTER_API_KEY:-}"
            write_env OPENROUTER_BASE_URL "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
            write_env OPENROUTER_MODEL "${OPENROUTER_MODEL:-openrouter/free}"

            docker compose down --remove-orphans || true
            docker compose up -d --build
            docker compose ps

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/api/health; then
                echo "Application is healthy"
                break
              fi
              echo "Waiting for application... attempt $i/30"
              sleep 2
              if [ "$i" = "30" ]; then
                echo "Application healthcheck failed"
                docker compose logs --tail=120
                exit 1
              fi
            done

            echo "=== OLLAMA HOST CHECK ==="
            curl -fsS http://10.77.0.2:11434/api/tags | jq -e '.models | map(.name) | index("qwen2.5:3b")' >/dev/null

            echo "=== OLLAMA FROM APP CONTAINER ==="
            docker compose exec -T app node -e "fetch('http://10.77.0.2:11434/v1/models').then(async r=>{if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(!j.data?.some(x=>x.id==='qwen2.5:3b'))throw new Error('qwen2.5:3b missing');console.log('Ollama reachable from app container')}).catch(e=>{console.error(e);process.exit(1)})"

            echo "=== OLLAMA INFERENCE SMOKE TEST ==="
            docker compose exec -T app node -e "fetch('http://10.77.0.2:11434/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer ollama'},body:JSON.stringify({model:'qwen2.5:3b',messages:[{role:'user',content:'Ответь одним словом: ГОТОВ'}],max_tokens:32,stream:false})}).then(async r=>{const t=await r.text();if(!r.ok)throw new Error('HTTP '+r.status+': '+t);const j=JSON.parse(t);if(!j.choices?.[0]?.message?.content)throw new Error('Empty Ollama response');console.log('Ollama inference OK:',j.choices[0].message.content.trim())}).catch(e=>{console.error(e);process.exit(1)})"

            test -n "${DND_MCP_TOKEN:-}"
            curl -fsS http://127.0.0.1:3000/mcp/health | grep -q 'dnd-realm-mcp'
            curl -fsS http://127.0.0.1:3000/.well-known/oauth-protected-resource | jq -e '.authorization_servers | length == 1' >/dev/null
            curl -fsS http://127.0.0.1:3000/.well-known/oauth-authorization-server | jq -e '.code_challenge_methods_supported | index("S256")' >/dev/null

            INIT=$(curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${DND_MCP_TOKEN}" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0.0"}}}' \
              http://127.0.0.1:3000/mcp)
            echo "$INIT" | jq -e '.result.protocolVersion' >/dev/null

            TOOLS=$(curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${DND_MCP_TOKEN}" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
              http://127.0.0.1:3000/mcp)
            echo "$TOOLS" | jq -e '.result.tools | map(.name) | index("get_game_state")' >/dev/null
            echo "MCP smoke test passed"
