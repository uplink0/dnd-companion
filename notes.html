<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Companion - Заметки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cinzel:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-icons@0.263.1/dist/umd/lucide.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <main class="main-content" style="margin-left: 0;">
            <div class="page-content">
                <button class="btn-back" data-back="tools.html">
                    <i data-lucide="arrow-left"></i>
                    Назад
                </button>

                <div class="page-header" style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1 class="page-title">Заметки</h1>
                        <p class="page-subtitle">Заметки кампании</p>
                    </div>
                    <button class="btn btn-primary" id="addNoteBtn">
                        <i data-lucide="plus"></i>
                        Новая
                    </button>
                </div>

                <!-- Notes List -->
                <div id="notesList"></div>
            </div>
        </main>
    </div>

    <!-- Add Note Modal -->
    <div class="modal-overlay" id="addNoteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Новая заметка</h3>
                <button class="btn-icon" data-close-modal>
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="input-group" style="margin-bottom: 16px;">
                    <label>Заголовок</label>
                    <input type="text" id="noteTitle" placeholder="Заголовок заметки">
                </div>
                <div class="input-group">
                    <label>Содержание</label>
                    <textarea id="noteContent" rows="5" placeholder="Текст заметки..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-close-modal>Отмена</button>
                <button class="btn btn-primary" id="confirmNote">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Note View Modal -->
    <div class="modal-overlay" id="noteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="noteModalTitle"></h3>
                <button class="btn-icon" data-close-modal>
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal-body" id="noteModalContent"></div>
            <div class="modal-footer">
                <button class="btn btn-primary" data-close-modal>Закрыть</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lucide-icons@0.263.1/dist/umd/lucide.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
