<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Companion - Бой</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cinzel:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-icons@0.263.1/dist/umd/lucide.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <main class="main-content" style="margin-left: 0;">
            <div class="page-content" style="max-width: 600px;">
                <button class="btn-back" data-back="tools.html">
                    <i data-lucide="arrow-left"></i>
                    Назад
                </button>

                <div class="page-header" style="margin-top: 20px; text-align: center;">
                    <h1 class="page-title" style="font-size: 36px;">COMBAT</h1>
                    <p class="page-subtitle" id="roundDisplay">ROUND 4</p>
                </div>

                <!-- Current Turn -->
                <div class="card" style="text-align: center; background: linear-gradient(135deg, rgba(201, 154, 62, 0.2) 0%, rgba(201, 154, 62, 0.05) 100%);">
                    <h3 style="margin-bottom: 8px;">CURRENT TURN</h3>
                    <h2 style="font-size: 28px; color: var(--gold-light);">Arthas</h2>
                </div>

                <!-- Combatants List -->
                <div id="combatList" style="margin: 20px 0;"></div>

                <!-- Actions -->
                <div class="combat-actions">
                    <button class="btn btn-secondary" id="damageBtn">DAMAGE</button>
                    <button class="btn btn-secondary" id="healBtn">HEAL</button>
                    <button class="btn btn-primary" id="nextTurnBtn">NEXT TURN</button>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lucide-icons@0.263.1/dist/umd/lucide.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
